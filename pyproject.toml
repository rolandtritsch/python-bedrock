[project]
name = "python-bedrock"
version = "0.1.0"
description = "My Python AWS Bedrock Playground"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.38.36",
    "faiss-cpu>=1.11.0",
    "langchain>=0.3.25",
    "langchain-aws>=0.2.25",
    "langchain-community>=0.3.25",
    "numpy>=2.3.0",
    "pypdf>=5.6.0",
]

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["infrastructure*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N"]
